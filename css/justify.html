<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Navigation Bar */
        #hello {
            background-color: rgb(113, 60, 139);
            min-height: 100px;
            margin: 20px;
            padding: 0 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-radius: 8px;
            border: 2px solid red;
        }

        /* Website Title */
        h1 {
            color: white;
            font-size: 25px;
        }

        /* Navigation Links */
        .me {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .youd {
            background-color: cadetblue;
            color: white;
            text-decoration: none;

            padding: 10px 18px;
            border: 2px solid black;
            border-radius: 20px;

            transition: 0.3s;
        }

        /* Hover Effect */
        .youd:hover {
            background-color: aquamarine;
            color: black;
            border: 2px solid red;
        }
    </style>
</head>

<body>

    <nav id="hello">

        <div class="me">
            <h1>Online Course Registration</h1>
        </div>

        <div class="me">
            <a class="youd" href="home">Home</a>
            <a class="youd" href="about">About</a>
            <a class="youd" href="contact">Contact</a>
        </div>

    </nav>

</body>
</html>
