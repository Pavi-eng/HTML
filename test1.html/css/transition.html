<html>
    <head>
        <title>Transition</title>
    </head>
    <style>
        #va{
            background-color: aquamarine;
            border: 1px solid red;
            border-radius:10px;
            padding:20px;
            margin-right:20px;
            text-align:center;
            transition:5s;
            
        }
        #po{
            background-color: crimson;
            border:1px solid black;
            border-radius: 10px;
            padding:20px;
            transition:5s;
        }
        #va:hover{
            background-color: blue;
        }
        #po:hover{
            background-color:cadetblue;
        }
    </style>
    <body>
        <center>
        <h2>Transition</h2>
        <div class="one">
            <button id="va">Myself</button>
            <button id="po">yourself</button>
        </div>
        </center>  
    </body>
</html>
